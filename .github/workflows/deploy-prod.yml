name: Deploy Backend to Production (api.eventjoy.hu)

on:
  push:
    branches:
      - main

env:
  AZURE_FUNCTIONAPP_NAME: 'eventjoy-test-api'
  AZURE_RESOURCE_GROUP: 'eventjoy-test-api_group'
  AZURE_FUNCTIONAPP_PACKAGE_PATH: '.'
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: Setup DotNet ${{ env.DOTNET_VERSION }} Environment
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 'Build and Publish'
        run: |
          cd "${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}"
          dotnet publish --configuration Release --output ./output

      - name: 'Zip the output (including .azurefunctions)'
        run: |
          cd "${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/output"
          zip -r ../publish.zip .

      - name: 'Login to Azure'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 'Deploy to Azure Functions via CLI'
        run: |
          az functionapp deployment source config-zip -g "${{ env.AZURE_RESOURCE_GROUP }}" -n "${{ env.AZURE_FUNCTIONAPP_NAME }}" --src "${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/publish.zip"
